# Smart3AI Portfolio Reverse Proxy
# Deploy this file under /etc/nginx/conf.d/smart3ai_portfolio.conf

# Upstreams
upstream smart3ai_adminapps_backend {
    server 127.0.0.1:8000;
}

upstream smart3ai_adminapps_frontend {
    server 127.0.0.1:3000;
}

upstream smart3ai_isosmart_backend {
    server 127.0.0.1:8001;
}

upstream smart3ai_isosmart_frontend {
    server 127.0.0.1:3001;
}

upstream smart3ai_vulnguard_backend {
    server 127.0.0.1:8011;
}

upstream smart3ai_vulnguard_frontend {
    server 127.0.0.1:5173;
}

upstream smart3ai_control_horas_backend {
    server 127.0.0.1:3002;
}

upstream smart3ai_control_horas_frontend {
    server 127.0.0.1:5174;
}

upstream smart3ai_condominios_backend {
    server 127.0.0.1:4000;
}

upstream smart3ai_condominios_frontend {
    server 127.0.0.1:5175;
}

upstream smart3ai_bot_cryptp_backend {
    server 127.0.0.1:8100;
}

upstream smart3ai_landing_frontend {
    server 127.0.0.1:4173;
}

# Shared security headers
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# SSO + AdminApps
server {
    listen 80;
    server_name sso.smart3ai.local adminapps.smart3ai.local;

    client_max_body_size 50M;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://smart3ai_adminapps_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
    }

    location /admin/ {
        proxy_pass http://smart3ai_adminapps_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://smart3ai_adminapps_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
    }
}

